name: Compilar XboxNX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas-pc:
    name: Pruebas del lector (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear ISOs de prueba
        run: |
          mkdir -p build-test
          python3 tests/mkxiso.py build-test/t.iso
          python3 tests/mkxiso.py build-test/full.iso --full-xgd2
          python3 tests/mkxiso.py build-test/bad.iso --bad-sha
      - name: Compilar y correr
        run: |
          # El APU (hakuX/xemu) y nv2a_vsh_cpu (dominio público): se compilan aparte, con avisos pero sin -Werror
          mkdir -p build-test/apu
          for f in source/apu/apu.c source/apu/vp/vp.c source/apu/vp/resample.c source/apu/dsp/dsp.c source/apu/dsp/dsp_cpu.c source/apu/dsp/dsp_dma.c source/apu/dsp/gp_ep.c source/apu/dsp/debug.c source/vsh/nv2a_vsh_cpu.c source/vsh/nv2a_vsh_disassembler.c source/vsh/nv2a_vsh_emulator.c source/vsh/nv2a_vsh_emulator_execution_state.c source/usb/usb.c source/usb/usb_hub.c source/usb/xid.c source/usb/ohci.c; do
            gcc -std=gnu11 -Wall -fsanitize=address,undefined -g -Isource -c $f -o build-test/apu/$(basename $f .c).o
          done
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -Isource \
            -o build-test/host_test tests/host_test.c source/disc.c source/xbe.c source/game.c source/xpr.c
          ./build-test/host_test build-test/t.iso XISO
          ./build-test/host_test build-test/full.iso "Disco completo XGD2"
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -DXBOXNX_NO_GL -Isource \
            -o build-test/load_test tests/load_test.c source/disc.c source/xbe.c source/game.c source/xpr.c \
            source/vm.c source/kernel.c source/kmm.c source/kob.c source/kps.c source/kio.c source/ksys.c source/xc_crypto.c source/hw.c source/nv2a_sw.c source/gpu.c source/workers.c source/prof.c source/aci.c build-test/apu/*.o source/loader.c source/sha1.c \
            source/cpu.c source/runner.c -lm -lpthread
          ./build-test/load_test build-test/t.iso
          ./build-test/load_test build-test/bad.iso --bad-sha
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -g -DXBOXNX_NO_GL -Isource \
            -o build-test/kernel_test tests/kernel_test.c source/vm.c source/kernel.c source/kmm.c source/kob.c \
            source/kps.c source/kio.c source/ksys.c source/xc_crypto.c source/hw.c source/nv2a_sw.c source/gpu.c source/workers.c source/prof.c source/aci.c build-test/apu/*.o source/disc.c source/cpu.c source/runner.c source/dump.c -lm -lpthread
          ./build-test/kernel_test build-test/t.iso
          gcc -std=gnu11 -Wall -Wextra -Werror -Isource -c tools/replay.c -o build-test/replay.o
          APU_HILO=1 ./build-test/kernel_test build-test/t.iso

  interprete:
    name: Intérprete x86 contra Unicorn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar 60.000 instrucciones aleatorias
        run: |
          pip install unicorn
          gcc -std=gnu11 -O2 -ffp-contract=off -Wall -Wextra -Werror -o cpu_diff tests/cpu_diff.c source/cpu.c source/vm.c -lm
          python3 tests/cpu_diff.py ./cpu_diff 30000 1
          python3 tests/cpu_diff.py ./cpu_diff 30000 2
      - name: Comparar x87, SSE y MMX (20.000 secuencias)
        run: |
          python3 tests/fp_diff.py ./cpu_diff 10000 1
          python3 tests/fp_diff.py ./cpu_diff 10000 2
      - name: Flags entre instrucciones (40.000 pares) y velocidad
        run: |
          python3 tests/flags_pair.py ./cpu_diff 20000 1
          python3 tests/flags_pair.py ./cpu_diff 20000 2
          gcc -std=gnu11 -O2 -ffp-contract=off -Wall -Wextra -Werror -Isource -o bench tests/bench.c source/cpu.c source/vm.c -lm
          ./bench 300
          SIN_BLOQUES=1 ./bench 300
      - name: Bloques decodificados (2d.1) contra Unicorn
        run: |
          CPU_BLOQUES=1 python3 tests/cpu_diff.py ./cpu_diff 30000 3
          CPU_BLOQUES=1 python3 tests/fp_diff.py ./cpu_diff 5000 3
          CPU_BLOQUES=1 CPU_BLOQUES_N=1000 python3 tests/fp_diff.py ./cpu_diff 8000 4
          python3 tests/block_seq.py ./cpu_diff 5000 1
          BENCH_MMX=1 ./bench 200
          BENCH_MMX=1 SIN_BLOQUES=1 ./bench 200
          CPU_BLOQUES=1 CPU_BLOQUES_N=2 python3 tests/flags_pair.py ./cpu_diff 20000 3
      - name: El mismo intérprete compilado para ARM64 (como en la Switch), con qemu
        run: |
          sudo apt-get install -y -q gcc-aarch64-linux-gnu qemu-user
          aarch64-linux-gnu-gcc -std=gnu11 -O2 -ffp-contract=off -static -o cpu_diff_a64 tests/cpu_diff.c source/cpu.c source/vm.c -lm
          printf '#!/bin/sh\nexec qemu-aarch64 ./cpu_diff_a64 "$@"\n' > cpu_diff_arm && chmod +x cpu_diff_arm
          CPU_BLOQUES=1 python3 tests/cpu_diff.py ./cpu_diff_arm 4000 5
          CPU_BLOQUES=1 python3 tests/fp_diff.py ./cpu_diff_arm 3000 5
          CPU_BLOQUES=1 CPU_BLOQUES_N=1000 python3 tests/fp_diff.py ./cpu_diff_arm 3000 7
          python3 tests/fp_diff.py ./cpu_diff_arm 3000 6
      - name: JIT a ARM64 (2d.2) contra el intérprete y Unicorn, con qemu
        run: |
          CPU_JIT=1 python3 tests/block_seq.py ./cpu_diff_arm 3000 3
          CPU_JIT=1 CPU_BLOQUES=1 CPU_BLOQUES_N=1000 python3 tests/fp_diff.py ./cpu_diff_arm 2000 8
          CPU_JIT=1 CPU_BLOQUES=1 CPU_BLOQUES_N=1000 python3 tests/flags_pair.py ./cpu_diff_arm 3000 8
          mkdir -p a64
          for f in source/apu/apu.c source/apu/vp/vp.c source/apu/vp/resample.c source/apu/dsp/dsp.c source/apu/dsp/dsp_cpu.c source/apu/dsp/dsp_dma.c source/apu/dsp/gp_ep.c source/apu/dsp/debug.c source/vsh/nv2a_vsh_cpu.c source/vsh/nv2a_vsh_disassembler.c source/vsh/nv2a_vsh_emulator.c source/vsh/nv2a_vsh_emulator_execution_state.c source/usb/usb.c source/usb/usb_hub.c source/usb/xid.c source/usb/ohci.c; do
            aarch64-linux-gnu-gcc -std=gnu11 -O1 -w -Isource -c $f -o a64/$(basename $f .c).o
          done
          mkdir -p build-test/hdd
          python3 tests/mkxiso.py build-test/t.iso
          aarch64-linux-gnu-gcc -std=gnu11 -O1 -Wall -Wextra -Werror -static -DXBOXNX_NO_GL -Isource -o kernel_test_a64 tests/kernel_test.c \
            source/vm.c source/kernel.c source/kmm.c source/kob.c source/kps.c source/kio.c source/ksys.c source/xc_crypto.c \
            source/hw.c source/nv2a_sw.c source/gpu.c source/workers.c source/prof.c source/aci.c a64/*.o source/disc.c source/cpu.c source/runner.c source/dump.c -lm -lpthread
          aarch64-linux-gnu-gcc -std=gnu11 -O2 -ffp-contract=off -static -Isource -o bench_a64 tests/bench.c source/cpu.c source/vm.c -lm
          qemu-aarch64 ./kernel_test_a64 build-test/t.iso
          qemu-aarch64 ./bench_a64 100
          SIN_JIT=1 qemu-aarch64 ./bench_a64 100

  switch:
    name: XboxNX.nro (Switch)
    runs-on: ubuntu-24.04
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: OpenGL para la Switch (mesa/nouveau, etapa 4c)
        run: dkp-pacman -Sy --noconfirm --needed switch-mesa switch-libdrm_nouveau
      - name: Compilar
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: XboxNX
          path: XboxNX.nro
      - name: Leer la versión del Makefile
        if: github.ref == 'refs/heads/main'
        id: ver
        run: echo "v=$(sed -n 's/^APP_VERSION[[:space:]]*:=[[:space:]]*//p' Makefile)" >> "$GITHUB_OUTPUT"
      - name: Publicar versión
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: XboxNX ${{ steps.ver.outputs.v }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            XboxNX.nro
            XboxNX.elf
          body: |
            Instalar: copia XboxNX.nro a sd:/switch/ y tu ISO de Xbox a sd:/xbox/.
            Abrelo desde el Homebrew Menu manteniendo R sobre un juego.
