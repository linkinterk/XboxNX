name: Compilar XboxNX

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas-pc:
    name: Pruebas del lector (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear ISOs de prueba
        run: |
          mkdir -p build-test
          python3 tests/mkxiso.py build-test/t.iso
          python3 tests/mkxiso.py build-test/full.iso --full-xgd2
      - name: Compilar y correr
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -fsanitize=address,undefined -g \
            -o build-test/host_test tests/host_test.c source/disc.c source/xbe.c source/game.c
          ./build-test/host_test build-test/t.iso XISO
          ./build-test/host_test build-test/full.iso "Disco completo XGD2"

  switch:
    name: XboxNX.nro (Switch)
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        run: make -j"$(nproc)"
      - uses: actions/upload-artifact@v4
        with:
          name: XboxNX
          path: XboxNX.nro
      - name: Publicar versión (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: XboxNX.nro
